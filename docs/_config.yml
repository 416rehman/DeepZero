title: DeepZero
tagline: Open-Source AI Vulnerability Research CLI & Pipeline Engine
description: "DeepZero CLI is a Python orchestration engine for automated vulnerability research: hunt BYOVD kernel drivers with Ghidra, Semgrep, and LOLDrivers, or audit Git repositories at scale with YAML pipelines and Claude Code or LiteLLM."
