# Offsets into the IRP are compared rather than written into the pattern. An
# ellipsis is not a valid operand of a binary expression, so `*(... + 0x18)`
# parses and then matches nothing at all. Binding the base and the offset to
# metavariables also sees through the cast ghidra emits, so both
# `*(longlong *)(param_2 + 0x18)` and `*(param_2 + 0x18)` are recognised.
rules:
  - id: ghidra-stack-buffer-no-length-check
    languages: [c]
    severity: ERROR
    message: >
      Stack buffer (local variable) used as destination for a copy
      operation where the length may come from IOCTL input. Classic
      kernel stack buffer overflow leading to privilege escalation.
    metadata:
      vuln_class: "Arbitrary Kernel Memory R/W"
      cwe: "CWE-121"
      exploitability: "HIGH"
    patterns:
      - pattern: |
          $TYPE $BUF[$SIZE];
          ...
          memcpy($BUF, ..., ...);
      - pattern-not-inside: |
          if ($LEN > $MAX) { ... }

  - id: ghidra-missing-output-length-check
    languages: [c]
    severity: WARNING
    message: >
      IoStatus.Information set without validating against
      OutputBufferLength. Can leak kernel memory to user mode.
    metadata:
      vuln_class: "Arbitrary Kernel Memory R/W"
      cwe: "CWE-200"
    patterns:
      - pattern: "*($BASE + $OFF) = ...;"
      # every dispatch routine reports a length, and a length of zero says no
      # bytes were returned, so it is the one value that cannot leak anything
      - pattern-not: "*($BASE + $OFF) = 0;"
      - metavariable-comparison:
          metavariable: $OFF
          comparison: $OFF == 0x38

  - id: ghidra-no-input-length-validation
    languages: [c]
    severity: WARNING
    message: >
      IOCTL handler does not appear to check InputBufferLength
      before accessing SystemBuffer contents. May allow reading
      beyond the user-supplied buffer.
    metadata:
      vuln_class: "Arbitrary Kernel Memory R/W"
      cwe: "CWE-120"
    patterns:
      - pattern: $X = *($BASE + $OFF);
      - metavariable-comparison:
          metavariable: $OFF
          comparison: $OFF == 0x18
      - pattern-not-inside: |
          if (... < ...) {
            ...
          }
