      - pattern: $CFG.InsecureSkipVerify = true

  - id: java-tls-verification-disabled
    languages: [java]
    severity: ERROR
    message: >
      The certificate or hostname check is replaced by one that accepts
      everything. Anyone in a position to intercept the traffic presents their
      own certificate and reads and rewrites it, including any credential the
      request carries.
    metadata:
      vuln_class: "Improper Certificate Validation"
      cwe: "CWE-295"
      exploitability: "HIGH"
      confidence: "high: an empty checkServerTrusted body and a verifier that returns true are both unambiguous"
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public boolean verify(...) {
            return true;
          }
      - pattern: $X.setHostnameVerifier(NoopHostnameVerifier.INSTANCE)
      - pattern: $X.setHostnameVerifier(new AllowAllHostnameVerifier(...))

  - id: ruby-tls-verification-disabled
    languages: [ruby]
