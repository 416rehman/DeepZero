      - pattern: "OpenSSL::SSL::SSLContext.new(verify_mode: OpenSSL::SSL::VERIFY_NONE)"

  - id: php-tls-verification-disabled
    languages: [php]
    severity: ERROR
    message: >
      Certificate verification is switched off for this request. Anyone in a
      position to intercept the traffic reads and rewrites it, including any
      credential the request carries. VERIFYHOST set to 0 or 1 also accepts a
      valid certificate issued for any other name.
    metadata:
      vuln_class: "Improper Certificate Validation"
      cwe: "CWE-295"
      exploitability: "HIGH"
      confidence: "high: these options have to be set explicitly"
    pattern-either:
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, false)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, 0)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, 0)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, false)

  - id: csharp-tls-verification-disabled
    languages: [csharp]
    severity: ERROR
    message: >
      The certificate validation callback accepts every certificate. Anyone in
      a position to intercept the traffic presents their own and reads and
      rewrites it, including any credential the request carries. Set on
      ServicePointManager it applies to every connection the process makes.
    metadata:
      vuln_class: "Improper Certificate Validation"
      cwe: "CWE-295"
      exploitability: "HIGH"
      confidence: "high: only a callback that returns true unconditionally is matched, so a validator that actually inspects the chain is not reported"
    pattern-either:
      - pattern: $X.ServerCertificateValidationCallback = (...) => true
      - pattern: $X.ServerCertificateValidationCallback += (...) => true
      - pattern: $X.ServerCertificateCustomValidationCallback = (...) => true
      - pattern: $X.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: |
          $X.ServerCertificateValidationCallback = delegate { return true; }
