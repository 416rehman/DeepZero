  # ------------------------------------------------ transport verification ---

  - id: python-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >
      Certificate verification is switched off for this connection. Anyone in
      a position to intercept the traffic, on the same network or anywhere
      along the path, reads and rewrites it, including the credentials the
      request carries.
    metadata:
      vuln_class: "Improper Certificate Validation"
      cwe: "CWE-295"
      exploitability: "HIGH"
      confidence: "medium: the flag is matched by keyword name on any call, which catches requests, httpx and boto3 and every wrapper around them, but also any local helper that happens to take a verify argument of its own"
    patterns:
      - pattern-either:
          - pattern: $F(..., verify=False, ...)
          - pattern: ssl._create_unverified_context(...)
          - pattern: $CTX.verify_mode = ssl.CERT_NONE
          - pattern: $CTX.check_hostname = False
      # jwt.decode takes the same keyword for the signature check, which is a
      # different bug with its own rule in authnz.yaml. without this the one
      # call is reported twice, once as something it is not.
      - pattern-not: jwt.decode(...)

  - id: javascript-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Certificate verification is switched off. Anyone in a position to
      intercept the traffic reads and rewrites it, including any credential the
      request carries. Setting NODE_TLS_REJECT_UNAUTHORIZED disables it for
      every connection the process makes, not just this one.
    metadata:
      vuln_class: "Improper Certificate Validation"
      cwe: "CWE-295"
      exploitability: "HIGH"
      confidence: "high: verification has to be disabled explicitly"
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: go-tls-verification-disabled
