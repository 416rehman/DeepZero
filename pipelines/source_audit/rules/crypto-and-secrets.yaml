# cryptography that does not do what the code around it assumes, and key
# material that is in the repository rather than in a secret store.
#
# none of these are taint rules. the defect is the choice itself: a broken mode,
# a predictable generator, a certificate check switched off, a key written into
# the source. all of it is visible where it is written.
#
# what a reviewer still has to decide for the weak-primitive rules is what the
# value protects. a digest used to name a cache entry is not a finding; the same
# call over a password is.

rules:
  # ------------------------------------------------------- weak primitives ---

  - id: python-weak-hash
    languages: [python]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest, signing or integrity checking
      or deduplication of security-relevant data, is defeated. If the input is
      a password, it is worse than that: a single unsalted digest pass is
      recovered from a wordlist at billions of guesses a second.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule; usedforsecurity=False is excluded"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
          - pattern: Crypto.Hash.MD5.new(...)
          - pattern: Crypto.Hash.SHA1.new(...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new(..., usedforsecurity=False, ...)

  - id: javascript-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; bcrypt, scrypt or argon2 are the alternatives.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or an etag is a legitimate use and matches this rule"
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createHmac("md5", ...)
      - pattern: $C.createHash("md5")
      - pattern: $C.createHash("sha1")

  - id: go-weak-hash
    languages: [go]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; golang.org/x/crypto/bcrypt is the alternative.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule"
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)

  - id: java-weak-hash
    languages: [java]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; BCrypt or PBKDF2 are the alternatives.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule"
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5", ...)
      - pattern: MessageDigest.getInstance("SHA-1", ...)
      - pattern: MessageDigest.getInstance("SHA1", ...)
      - pattern: DigestUtils.md5Hex(...)
      - pattern: DigestUtils.md5(...)
      - pattern: DigestUtils.sha1Hex(...)

  - id: ruby-weak-hash
    languages: [ruby]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; bcrypt is the alternative.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule"
    pattern-either:
      - pattern: Digest::MD5.hexdigest(...)
      - pattern: Digest::MD5.digest(...)
      - pattern: Digest::SHA1.hexdigest(...)
      - pattern: Digest::SHA1.digest(...)
      - pattern: OpenSSL::Digest::MD5.new(...)
      - pattern: OpenSSL::Digest::SHA1.new(...)

  - id: php-weak-hash
    languages: [php]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; password_hash is what PHP provides instead.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule"
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: hash("md5", ...)
      - pattern: hash("sha1", ...)

  - id: csharp-weak-hash
    languages: [csharp]
    severity: WARNING
    message: >
      MD5 and SHA-1 are chosen here. Both are collision-broken, so any use that
      relies on two inputs not sharing a digest is defeated. If the input is a
      password, a single digest pass is recovered from a wordlist at billions
      of guesses a second; Rfc2898DeriveBytes with a high iteration count is
      the alternative in the framework.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "medium: a digest used as a cache key or a non-security checksum is a legitimate use and matches this rule"
    pattern-either:
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern: new MD5CryptoServiceProvider(...)
      - pattern: new SHA1CryptoServiceProvider(...)
      - pattern: new SHA1Managed(...)

  - id: python-weak-cipher-or-mode
    languages: [python]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption; an
      attacker can also reorder and replay blocks undetected. DES, 3DES and RC4
      are broken outright at their key or block size. None of these carry an
      integrity check either, so ciphertext can be altered in transit.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the mode and the algorithm are named at the call site; AES-GCM is the usual replacement"
    pattern-either:
      - pattern: AES.new($K, AES.MODE_ECB, ...)
      - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB(...)
      - pattern: modes.ECB(...)
      - pattern: DES.new(...)
      - pattern: DES3.new(...)
      - pattern: ARC4.new(...)
      - pattern: Blowfish.new(...)
      - pattern: algorithms.ARC4(...)
      - pattern: algorithms.TripleDES(...)
      - pattern: algorithms.Blowfish(...)

  - id: javascript-weak-cipher-or-mode
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption.
      createCipher without an IV is worse: it derives the key from the password
      with a single MD5 pass and uses a fixed IV, so the same message always
      encrypts identically. DES and RC4 are broken outright.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the algorithm string names the mode; createCipheriv with aes-256-gcm is the replacement"
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALG, ...)
          - pattern: crypto.createDecipheriv($ALG, ...)
          - pattern: $C.createCipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'].*(ecb|des|rc4|rc2).*["']$

  - id: go-weak-cipher
    languages: [go]
    severity: WARNING
    message: >
      DES and RC4 are broken outright: DES has a 56 bit key that is brute
      forced in hours, and RC4's keystream is biased enough to recover
      plaintext from repeated encryptions of the same data. crypto/aes with
      GCM is the replacement.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the package chosen is the finding"
    pattern-either:
      - pattern: des.NewCipher(...)
      - pattern: des.NewTripleDESCipher(...)
      - pattern: rc4.NewCipher(...)

  - id: java-weak-cipher-or-mode
    languages: [java]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption.
      Cipher.getInstance("AES") is ECB as well, because that is the JCE
      default. DES, 3DES and RC4 are broken outright at their key size.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the transformation string names the mode, and the bare algorithm name is documented as defaulting to ECB"
    patterns:
      - pattern: Cipher.getInstance($TRANSFORM, ...)
      - metavariable-regex:
          metavariable: $TRANSFORM
          regex: (?i)^"(AES|DES|DESede|RC2|RC4|ARCFOUR|Blowfish)(/ECB/.*)?"$

  - id: ruby-weak-cipher-or-mode
    languages: [ruby]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption.
      DES and RC4 are broken outright at their key size. AES-256-GCM is the
      replacement, and it authenticates the ciphertext as well.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the cipher string names the mode"
    patterns:
      - pattern-either:
          - pattern: OpenSSL::Cipher.new($ALG)
          - pattern: OpenSSL::Cipher::Cipher.new($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'].*(ecb|des|rc4|rc2).*["']$

  - id: php-weak-cipher-or-mode
    languages: [php]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption.
      DES and RC4 are broken outright at their key size. aes-256-gcm is the
      replacement, and it authenticates the ciphertext as well.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the cipher string names the mode"
    patterns:
      - pattern-either:
          - pattern: openssl_encrypt($DATA, $ALG, ...)
          - pattern: openssl_decrypt($DATA, $ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'].*(ecb|des|rc4|rc2).*["']$

  - id: csharp-weak-cipher-or-mode
    languages: [csharp]
    severity: WARNING
    message: >
      ECB encrypts every block independently, so equal plaintext blocks produce
      equal ciphertext and the structure of the message survives encryption.
      DES and RC2 are broken outright at their key size. AesGcm is the
      replacement, and it authenticates the ciphertext as well.
    metadata:
      vuln_class: "Weak Cryptography"
      cwe: "CWE-327"
      confidence: "high: the mode and the algorithm are named where they are set"
    pattern-either:
      - pattern: $X.Mode = CipherMode.ECB
      - pattern: DES.Create(...)
      - pattern: RC2.Create(...)
      - pattern: new DESCryptoServiceProvider(...)
      - pattern: new RC2CryptoServiceProvider(...)
      - pattern: new TripleDESCryptoServiceProvider(...)

  # -------------------------------------------------- predictable material ---

  - id: python-insecure-random-for-secret
    languages: [python]
    severity: ERROR
    message: >
      A security value is generated from the Mersenne Twister, which is not a
      cryptographic generator. Its internal state is recoverable from a few
      hundred outputs, so an attacker who collects tokens can predict every
      later one, and every earlier one, which means resetting another user's
      password or taking over their session. secrets is the module for this.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the value has to be assigned to a security-named variable or be inside a function named for one, so shuffling a deck or picking a sample is not reported"
    patterns:
      - pattern-either:
          - pattern: random.random(...)
          - pattern: random.randint(...)
          - pattern: random.randrange(...)
          - pattern: random.choice(...)
          - pattern: random.choices(...)
          - pattern: random.sample(...)
          - pattern: random.getrandbits(...)
          - pattern: random.uniform(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $VAR = ...
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*
          - patterns:
              - pattern-inside: |
                  def $F(...):
                      ...
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*

  - id: javascript-insecure-random-for-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A security value is generated from Math.random, which is not a
      cryptographic generator and is seeded per process. An attacker who
      collects a few outputs recovers the state and predicts every later token,
      which means taking over an account through a password reset link or a
      session identifier. crypto.randomBytes is the replacement.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the value has to be assigned to a security-named variable or be inside a function named for one"
    patterns:
      - pattern: Math.random(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $VAR = ...
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*
          - patterns:
              - pattern-inside: |
                  function $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*

  - id: go-insecure-random-for-secret
    languages: [go]
    severity: ERROR
    message: >
      A security value is generated from math/rand, which is not a
      cryptographic generator. Its output is predictable from a handful of
      samples, so an attacker who collects tokens predicts every later one and
      takes over accounts through them. crypto/rand is the replacement.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the value has to be assigned to a security-named variable or be inside a function named for one"
    patterns:
      - pattern-either:
          - pattern: rand.Int(...)
          - pattern: rand.Intn(...)
          - pattern: rand.Int31(...)
          - pattern: rand.Int63(...)
          - pattern: rand.Float64(...)
          - pattern: rand.Perm(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $VAR := ...
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*
          - patterns:
              - pattern-inside: |
                  func $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*

  - id: java-insecure-random-for-secret
    languages: [java]
    severity: ERROR
    message: >
      A security value is generated from java.util.Random, which is a linear
      congruential generator seeded from the clock. Two outputs are enough to
      recover the state and predict every later token, which means taking over
      an account through a password reset link. SecureRandom is the
      replacement.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the generator is matched by its declared type, so SecureRandom, which shares every one of these method names, is not reported"
    patterns:
      # the type is named because SecureRandom exposes the same methods, and
      # flagging it would report the fix as the bug. the constructor is not
      # matched on its own: `new Random().nextInt(n)` is one defect, and
      # matching both the construction and the draw reports it twice.
      - pattern-either:
          - pattern: Math.random()
          - pattern: (java.util.Random $R).nextInt(...)
          - pattern: (java.util.Random $R).nextLong(...)
          - pattern: (java.util.Random $R).nextDouble(...)
          - pattern: (java.util.Random $R).nextFloat(...)
          - pattern: (java.util.Random $R).nextBytes(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $TYPE $VAR = ...;
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*
          - patterns:
              - pattern-inside: |
                  $RET $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*

  - id: ruby-insecure-random-for-secret
    languages: [ruby]
    severity: ERROR
    message: >
      A security value is generated from Kernel#rand, which is not a
      cryptographic generator. Its state is recoverable from a handful of
      outputs, so an attacker who collects tokens predicts every later one and
      takes over accounts through them. SecureRandom is the replacement, and
      SecureRandom.hex is a drop-in for most of these.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the value has to be assigned to a security-named variable or be inside a method named for one, and SecureRandom is a different receiver so the fix is not reported as the bug"
    patterns:
      - pattern-either:
          - pattern: rand(...)
          - pattern: Random.rand(...)
          - pattern: Random.new(...).rand(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $VAR = ...
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*
          - patterns:
              # both forms are needed: a ruby method taking no arguments is
              # written without parentheses and the other pattern misses it
              - pattern-either:
                  - pattern-inside: |
                      def $F(...)
                        ...
                      end
                  - pattern-inside: |
                      def $F
                        ...
                      end
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|api[-_]?key|reset).*

  - id: php-insecure-random-for-secret
    languages: [php]
    severity: ERROR
    message: >
      A security value is generated from rand, mt_rand or uniqid. None of them
      is a cryptographic generator: mt_rand's state is recoverable from a few
      outputs and uniqid is derived from the clock, so an attacker predicts
      every token the application issues and takes over accounts through
      password reset links. random_bytes is the replacement.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the value has to be assigned to a security-named variable or be inside a function named for one"
    patterns:
      - pattern-either:
          - pattern: rand(...)
          - pattern: mt_rand(...)
          - pattern: uniqid(...)
          - pattern: shuffle(...)
          - pattern: str_shuffle(...)
          - pattern: array_rand(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $VAR = $X;
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*
          - patterns:
              - pattern-inside: |
                  function $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*

  - id: csharp-insecure-random-for-secret
    languages: [csharp]
    severity: ERROR
    message: >
      A security value is generated from System.Random, which is not a
      cryptographic generator and is seeded from the clock. An attacker who
      knows roughly when a token was issued reproduces it, which means taking
      over an account through a password reset link.
      RandomNumberGenerator.GetBytes is the replacement.
    metadata:
      vuln_class: "Insecure Randomness"
      cwe: "CWE-338"
      exploitability: "HIGH"
      confidence: "high: the generator is matched by its declared type, so RandomNumberGenerator is not reported"
    patterns:
      # as in the java rule: the constructor is not a sink on its own, because
      # `new Random().Next(n)` would otherwise be reported once for the
      # construction and once for the draw
      - pattern-either:
          - pattern: (System.Random $R).Next(...)
          - pattern: (System.Random $R).NextDouble(...)
          - pattern: (System.Random $R).NextBytes(...)
      - pattern-either:
          - patterns:
              - pattern-inside: $TYPE $VAR = ...;
              - metavariable-regex:
                  metavariable: $VAR
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*
          - patterns:
              - pattern-inside: |
                  $RET $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|csrf|apikey|reset).*

  # ------------------------------------------------- keys in the repository --

  # one rule per language rather than one rule listing them all: a pattern that
  # fails to parse in any single listed language silently voids the rule for
  # every language, and the run then reports nothing rather than failing.
  - id: python-hardcoded-secret-assignment
    languages: [python]
    severity: ERROR
    message: >
      A credential is assigned from a literal in the source. Everyone with read
      access to the repository holds it, it is in the history after any later
      removal, and it is in every build artefact and every fork. Rotating it
      takes a code change and a deploy.
    metadata:
      vuln_class: "Hardcoded Credentials"
      cwe: "CWE-798"
      exploitability: "HIGH"
      confidence: "medium: a credential-shaped name and a literal of at least twelve characters; placeholders and values that read as a filename or path are excluded, but a test fixture with a realistic looking value still matches"
    patterns:
      - pattern: $NAME = $VALUE
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(passwd|password|secret|api[-_]?key|apikey|auth[-_]?token|access[-_]?token|private[-_]?key|client[-_]?secret|encryption[-_]?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'][A-Za-z0-9+/_.\-]{12,}["']$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!["'](changeme|placeholder|example|your[-_]?\w+|xxx+|todo|dummy|sample|redacted))(?!.*\.[a-z]{2,5}["']$)

  - id: javascript-hardcoded-secret-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      A credential is assigned from a literal in the source. Everyone with read
      access to the repository holds it, it is in the history after any later
      removal, and it ships in every bundle built from this file.
    metadata:
      vuln_class: "Hardcoded Credentials"
      cwe: "CWE-798"
      exploitability: "HIGH"
      confidence: "medium: a credential-shaped name and a literal of at least twelve characters; placeholders and values that read as a filename or path are excluded, but a test fixture with a realistic looking value still matches"
    patterns:
      - pattern: $NAME = $VALUE
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(passwd|password|secret|api[-_]?key|apikey|auth[-_]?token|access[-_]?token|private[-_]?key|client[-_]?secret|encryption[-_]?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'`][A-Za-z0-9+/_.\-]{12,}["'`]$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!["'`](changeme|placeholder|example|your[-_]?\w+|xxx+|todo|dummy|sample|redacted))(?!.*\.[a-z]{2,5}["'`]$)

  - id: java-hardcoded-secret-assignment
    languages: [java]
    severity: ERROR
    message: >
      A credential is assigned from a literal in the source. Everyone with read
      access to the repository holds it, it survives in the history after any
      later removal, and it is readable in the shipped class file.
